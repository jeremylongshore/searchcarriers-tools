[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searchcarriers-tools"
dynamic = ["version"]
description = "Plugin and skills repo for SearchCarriers motor carrier intelligence"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Jeremy Longshore", email = "jeremy@intentsolutions.io" },
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "weasyprint>=62.0",
]

[project.urls]
Homepage = "https://github.com/jeremylongshore/searchcarriers-tools"
Documentation = "https://github.com/jeremylongshore/searchcarriers-tools#readme"
Issues = "https://github.com/jeremylongshore/searchcarriers-tools/issues"
Source = "https://github.com/jeremylongshore/searchcarriers-tools"

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7",
    "hypothesis>=6.0",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-html>=4.0",
    "python-dotenv>=1.0",
    "radon>=6.0",
    "respx>=0.21",
    "ruff>=0.4",
    "pyyaml>=6.0",
    "mcp>=1.0,<2",  # 2.x removed the Server.list_tools()/call_tool() decorators the plugin servers use
]

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring API access",
    "contract: marks protocol and schema contract tests",
    "performance: marks bounded local performance tests",
]

[tool.coverage.run]
branch = true
source = ["plugins"]
parallel = true
patch = ["subprocess"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".audit-harness"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
