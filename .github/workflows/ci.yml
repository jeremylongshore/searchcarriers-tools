name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: pip install pyyaml

      - name: Lint plugin.json files
        run: |
          find plugins -name "plugin.json" -exec python3 -m json.tool {} \; > /dev/null

      - name: Validate SKILL.md frontmatter
        run: |
          ./scripts/validate.sh --skills-only

      - name: Check for secrets
        run: |
          ! grep -Ern "Bearer [0-9]+\|[A-Za-z0-9]" --include="*.py" --include="*.md" --include="*.json" \
            --exclude-dir=.git --exclude="API-DISCOVERY.md" . || \
            (echo "ERROR: Possible API key found in tracked files" && exit 1)

      - name: Check for absolute paths in skills
        run: |
          ! grep -rn "/home/\|/Users/\|C:\\\\" skills/ plugins/ --include="*.md" || \
            (echo "ERROR: Absolute paths found - use {baseDir}/ instead" && exit 1)

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run validation (verbose)
        run: ./scripts/validate.sh --verbose

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run security checks
        run: |
          bandit -q -r plugins scripts -x tests -c pyproject.toml
          pip-audit --local --skip-editable

      - name: Verify audit harness and schemas
        run: |
          scripts/audit-harness verify
          scripts/audit-harness conform .

      - name: Scan proposed diff for weakened gates
        if: github.event_name == 'pull_request'
        run: git diff "origin/${{ github.base_ref }}...HEAD" | scripts/audit-harness escape-scan -

      - name: Run tests with branch coverage
        run: |
          pytest -q \
            --cov=plugins \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Run advisory harness audit
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: |
          scripts/audit-harness audit . --deep
          scripts/audit-harness scan .
          scripts/audit-harness currency .
