name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint plugin.json files
        run: |
          find plugins -name "plugin.json" -exec python3 -m json.tool {} \; > /dev/null

      - name: Validate SKILL.md frontmatter
        run: |
          ./scripts/validate.sh --skills-only

      - name: Check for secrets
        run: |
          ! grep -rn "Bearer [0-9]\+|[A-Za-z0-9]" --include="*.py" --include="*.md" --include="*.json" \
            --exclude-dir=.git --exclude="API-DISCOVERY.md" . || \
            (echo "ERROR: Possible API key found in tracked files" && exit 1)

      - name: Check for absolute paths in skills
        run: |
          ! grep -rn "/home/\|/Users/\|C:\\\\" skills/ plugins/ --include="*.md" || \
            (echo "ERROR: Absolute paths found - use {baseDir}/ instead" && exit 1)

  test:
    name: Test
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run validation (verbose)
        run: ./scripts/validate.sh --verbose

      - name: Run tests
        run: pytest -v
