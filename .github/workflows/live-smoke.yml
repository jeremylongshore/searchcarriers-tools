name: Live API smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 2"

permissions:
  contents: read

jobs:
  live-smoke:
    name: SearchCarriers live contract
    runs-on: ubuntu-latest
    environment: searchcarriers-live-test
    env:
      SEARCHCARRIERS_API_KEY: ${{ secrets.SEARCHCARRIERS_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Require protected live-test credential
        run: test -n "$SEARCHCARRIERS_API_KEY"

      - name: Run bounded live API contract tests
        run: pytest -q -m integration tests/test_smoke_*.py
